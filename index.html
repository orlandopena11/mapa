<!-- PARTE: 1-2 (ESTRUCTURA CORE HTML5 ZILLOW V2) -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Inmobiliario - Inmobiliaria en Surco</title>
    <!-- Motores Estructurales y de Diseño -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" type="image/jpeg" href="logo.jpg" />
    <link rel="icon" type="image/png" href="favicon.png" />


</head>
<body>
    <div class="app-container">
        <!-- Barra Superior Global (Navbar & Filtros Avanzados) -->
    <!-- Barra Superior Global (Navbar & Filtros Avanzados) -->
    <!-- Barra Superior Global (Navbar & Filtros Avanzados) -->
    <header class="navbar-global">
        <img src="logo.jpg" alt="Logo Zillow" class="navbar-brand-logo" id="app-main-logo">
        
        <!-- 1. BUSCADOR DE DIRECCIÓN AISLADO -->
        <div class="search-controls">
            <input type="text" class="search-input" id="search-address" placeholder="Dirección, ciudad o distrito...">
        </div>

        <!-- 2. FILTRO DE TRANSACCIÓN (ESTADO) -->
        <div class="filter-dropdown-wrapper">
            <button class="filter-btn" id="btn-filter-status">En venta ▾</button>
            <div class="dropdown-content-panel" id="dropdown-status">
                <div class="filter-group-options">
                    <label class="filter-checkbox-label">
                        <input type="radio" name="transaccion" value="Venta" checked> En venta
                    </label>
                    <label class="filter-checkbox-label">
                        <input type="radio" name="transaccion" value="Alquiler"> Para el alquiler
                    </label>
                    <label class="filter-checkbox-label">
                        <input type="radio" name="transaccion" value="Vendido"> Vendidas
                    </label>
                </div>
            </div>
        </div>

        <!-- 3. FILTRO DE RANGO DE PRECIOS -->
        <div class="filter-dropdown-wrapper">
            <button class="filter-btn" id="btn-filter-price">Precio ▾</button>
            <div class="dropdown-content-panel" id="dropdown-price">
                <div class="filter-section-title">Rango de precios</div>
                <div class="histogram-visual-container" id="price-histogram-box"></div>
                <div class="range-inputs-inputs-row">
                    <input type="number" class="range-box-input" id="price-min" placeholder="No Min">
                    <span>-</span>
                    <input type="number" class="range-box-input" id="price-max" placeholder="No Max">
                </div>
            </div>
        </div>

        <!-- 4. FILTRO DE CAMAS Y BAÑOS -->
        <div class="filter-dropdown-wrapper">
            <button class="filter-btn" id="btn-filter-specs">Camas y baños ▾</button>
            <div class="dropdown-content-panel" id="dropdown-specs">
                <div class="filter-section-title">Dormitorios</div>
                <div class="segmented-control-row" id="row-beds">
                    <button class="segmented-btn active" data-val="0">Cualquiera</button>
                    <button class="segmented-btn" data-val="1">1+</button>
                    <button class="segmented-btn" data-val="2">2+</button>
                    <button class="segmented-btn" data-val="3">3+</button>
                    <button class="segmented-btn" data-val="4">4+</button>
                    <button class="segmented-btn" data-val="5">5+</button>
                </div>
                <label class="filter-checkbox-label" style="margin-bottom: 12px;">
                    <input type="checkbox" id="beds-exact"> Coincidencia exacta
                </label>
                <div class="filter-section-title">Baños</div>
                <div class="segmented-control-row" id="row-baths">
                    <button class="segmented-btn active" data-val="0">Cualquiera</button>
                    <button class="segmented-btn" data-val="1">1+</button>
                    <button class="segmented-btn" data-val="1.5">1.5+</button>
                    <button class="segmented-btn" data-val="2">2+</button>
                    <button class="segmented-btn" data-val="3">3+</button>
                    <button class="segmented-btn" data-val="4">4+</button>
                </div>
            </div>
        </div>

        <!-- 5. FILTRO DE TIPO DE PROPIEDAD CORREGIDO -->
        <div class="filter-dropdown-wrapper">
            <button class="filter-btn" id="btn-filter-type">Tipo de propiedad ▾</button>
            <div class="dropdown-content-panel" id="dropdown-type">
                <div class="filter-group-options">
                    <label class="filter-checkbox-label">
                        <input type="checkbox" id="type-select-all" checked> Seleccione Todos
                    </label>
                    <label class="filter-checkbox-label">
                        <input type="checkbox" class="type-cb" value="Casa" checked> Casas
                    </label>
                    <label class="filter-checkbox-label">
                        <input type="checkbox" class="type-cb" value="Departamento" checked> Departamentos
                    </label>
                    <label class="filter-checkbox-label">
                        <input type="checkbox" class="type-cb" value="Terreno" checked> Terrenos
                    </label>
                    <label class="filter-checkbox-label">
                        <input type="checkbox" class="type-cb" value="Local" checked> Locales
                    </label>
                    <label class="filter-checkbox-label">
                        <input type="checkbox" class="type-cb" value="Oficina" checked> Oficinas
                    </label>
                    <label class="filter-checkbox-label">
                        <input type="checkbox" class="type-cb" value="Edificio" checked> Edificios
                    </label>
                    <label class="filter-checkbox-label">
                        <input type="checkbox" class="type-cb" value="Lote" checked> Lotes
                    </label>
                </div>
                <!-- BOTÓN APLICAR INTEGRADO SIN MODIFICAR ESTILOS PROHIBIDOS -->
                <div style="margin-top: 14px; padding-top: 10px; border-top: 1px solid #e2e8f0; text-align: right; width: 100%;">
                    <button id="btn-aplicar-tipo-propiedad" style="background-color: #006aff; color: #ffffff; border: none; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 4px; cursor: pointer; font-family: sans-serif; width: 100%;">
                        Aplicar Filtro
                    </button>
                </div>
            </div>
        </div>

        
        <!-- 6. FILTRO MAESTRO DE FILTROS AVANZADOS -->
        <div class="filter-dropdown-wrapper">
            <button class="filter-btn" id="btn-filter-more">Filtros ▾</button>
            <div class="dropdown-content-panel" id="dropdown-more-filters">
                <div class="filter-section-title">Tipo de listado</div>
                <div class="filter-group-options">
                    <!-- Pegar esto exactamente en la línea 134 del index.html -->
            <label class="filter-checkbox-label">
                <input type="checkbox" id="check-todos-listados" checked> <strong>Seleccione todos</strong>
            </label>
            <hr style="margin: 5px 0; opacity: 0.1;">
    
            <label><input type="checkbox" class="more-filter-cb" value="propietario" checked> Propietario publicado</label>
            <label><input type="checkbox" class="more-filter-cb" value="agente" checked> Agente listado</label>
            <label><input type="checkbox" class="more-filter-cb" value="nueva construccion" checked> Nueva construcción</label>
            <label><input type="checkbox" class="more-filter-cb" value="ejecucion hipoteca" checked> Ejecuciones hipotecarias</label>
            <label><input type="checkbox" class="more-filter-cb" value="subasta" checked> Subastas</label>

                </div>
            </div>
        </div>

    </header>
<!-- ========================================================================
     NUEVA INSERCIÓN: ENCABEZADO GLOBAL COMPARTIDO (PANTALLAS 2 Y 3)
     Ubicación semántica externa para evitar mutaciones de herencia en split-view
     ======================================================================== -->
<header id="header-ficha-global" class="nav-ficha-zillow oculta-global">
    <button type="button" class="btn-volver-zillow" id="btn-volver-global-atras">← Volver a la lista</button>
    
    <img src="logo.jpg" alt="Logo Principal" class="logo-centro-ficha">
    
    <div class="acciones-nav-ficha">
        <button type="button" class="btn-nav-accion" id="btn-compartir-global">
            ➦ Compartir
        </button>
        <button type="button" class="btn-nav-accion" id="btn-favorito-global">
            <span id="icon-corazon-global">♡</span> <span id="text-favorito-global">Ahorrar</span>
        </button>
    </div>
</header>

        <!-- Contenedor Principal Split-View Respetando IDs Nativos -->
        <main class="split-view">
            <div class="map-wrapper">
                <div id="map-instance"></div>
            </div>
            
            <div class="properties-panel">
                <div class="panel-header">
                    <h1 id="results-counter">Cargando propiedades...</h1>
                </div>
                <!-- Punto de Inyección Sincronizado del Catalogo -->
                <div class="properties-grid" id="properties-grid-target"></div>
            </div>
    <!-- ... Código anterior de tu archivo (Filtros, Mapa y Catalogo) ... -->
    </main>
  </div>

  <!-- ======================================================================= -->
  <!-- INSERCIÓN COMPATIBLE: TERCERA PANTALLA (GALERÍA EXPANDIDA ESTILO ZILLOW)-->
  <!-- ======================================================================= -->
  <div id="vista-galeria-expandida" class="galeria-tercera-pantalla oculta">
    
    <!-- Bloque Dinámico Izquierdo con Scroll Independiente -->
    <main id="mosaico-imagenes-scroll" class="columna-fotos-mosaico">
      <!-- Inyección dinámica de etiquetas <img> vía JS -->
    </main>
    
    <!-- Bloque Fijo Derecho de Información Comercial -->
    <aside class="columna-informacion-fija">
      <div class="cabecera-navegacion">
        <button id="btn-volver-detalle" class="btn-regresar">← Volver al detalle</button>
      </div>
      
      <div class="bloque-comercial-contenido">
        <h2 id="galeria-precio" class="texto-precio"></h2>
        <p id="galeria-specs-principales" class="texto-specs"></p>
        
        <div class="bloque-direccion">
          <p id="galeria-direccion-linea1" class="direccion-primaria"></p>
          <p id="galeria-direccion-linea2" class="direccion-secundaria"></p>
        </div>
        
        <!-- Contenedor de Botones de Acción -->
        <div class="acciones-galeria-contenedor">
        <!-- Busca estas líneas en tu index.html y déjalas con estos nombres exactos -->
        <button id="btn-solicitar-tour-galeria" class="btn-accion-primario">Solicitar un tour</button>
        <button id="btn-contactar-agente-galeria" class="btn-accion-secundario">Contacte con un agente</button>

        </div>
      </div>
    </aside>

  </div>

<!-- ========================================================================
     MODALES FLOTANTES DE ACCIÓN COMERCIAL (INSERCIÓN COMPATIBLE V2)
     Ubicados fuera del flujo SPA para evitar rupturas del layout e indexación
     ======================================================================== -->

<!-- INTERFAZ FLOTANTE: SOLICITAR UN TOUR -->
<div id="modal-tour-comercial" class="modal-accion-overlay" aria-hidden="true" role="dialog" aria-labelledby="titulo-modal-tour">
    <div class="modal-accion-contenido">
        <button type="button" class="btn-cerrar-popup" aria-label="Cerrar modal">&times;</button>
        <h3 id="titulo-modal-tour">Programar Visita</h3>
        <p class="modal-subtitulo-info">Seleccione el horario de su preferencia para coordinar con un asesor.</p>
        
        <form id="form-solicitar-tour">
            <div class="campo-formulario">
                <label for="tour-fecha">Fecha Sugerida</label>
                <input type="date" id="tour-fecha" required>
            </div>
            
            <div class="campo-formulario">
                <label for="tour-hora">Hora Sugerida</label>
                <input type="time" id="tour-hora" min="08:00" max="18:00" required>
            </div>

            <div class="campo-formulario">
                <label>Tipo de Visita</label>
                <select id="tour-tipo" required>
                    <option value="Presencial" selected>Presencial (En el inmueble)</option>
                    <option value="Virtual">Virtual (Videollamada guiada)</option>
                </select>
            </div>

            <button type="submit" class="btn-enviar-formulario">Confirmar mi Solicitud</button>
        </form>
    </div>
</div>

<!-- INTERFAZ FLOTANTE: CONTACTE CON UN AGENTE -->
<div id="modal-agente-comercial" class="modal-accion-overlay" aria-hidden="true" role="dialog" aria-labelledby="titulo-modal-agente">
    <div class="modal-accion-contenido">
        <button type="button" class="btn-cerrar-popup" aria-label="Cerrar modal">&times;</button>
        <h3 id="titulo-modal-agente">Contactar Agente</h3>
        <p class="modal-subtitulo-info">Envíe un mensaje directo para recibir información detallada del inmueble.</p>
        
        <form id="form-contactar-agente">
            <div class="campo-formulario">
                <label for="agente-mensaje">Mensaje</label>
                <textarea id="agente-mensaje" rows="5" required></textarea>
            </div>

            <div class="campo-formulario">
                <label for="agente-telefono">Tu Teléfono Celular</label>
                <input type="tel" id="agente-telefono" placeholder="Ej. +51 999 888 777" required>
            </div>

            <button type="submit" class="btn-enviar-formulario">Enviar Mensaje de Interés</button>
        </form>
    </div>
</div>

<!-- ========================================================================
     CORTINA SPA UNIFICADA (SISTEMA SIMPLIFICADO PARA PANTALLAS 2 Y 3)
     Ubicada en la raíz del body para deslizarse de forma natural sobre el mapa
     ======================================================================== -->
<div id="cortina-spa" class="cortina-escondida"></div>

    
    <!-- Carga de Motores JavaScript en el Cierre del Body -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
