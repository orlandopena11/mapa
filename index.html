<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Inmobiliario - Estilo Zillow V2</title>
    
    <!-- Hoja de Estilos Externa para el Mapa -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    
    <!-- Enlace a tus estilos locales -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="app-container">
        <!-- Barra Superior Global (Navbar & Filtros) -->
        <header class="navbar-global">
            <div class="navbar-brand">Zillow OS</div>
            <div class="search-controls">
                <input type="text" class="search-input" id="search-address" placeholder="Dirección, ciudad o distrito...">
                <button class="filter-btn">En venta</button>
                <button class="filter-btn">Precio</button>
                <button class="filter-btn">Camas y baños</button>
            </div>
        </header>
        <!-- Contenedor Principal Split-View -->
        <main class="split-view">
            <!-- Lado Izquierdo: Mapa Modular -->
            <div class="map-wrapper">
                <div id="map-instance"></div>
            </div>

            <!-- Lado Derecho: Panel Escrolable de Resultados -->
            <div class="properties-panel">
                <div class="panel-header">
                    <h1 id="results-counter">Cargando propiedades...</h1>
                </div>
                <div class="properties-grid" id="properties-grid-target">
                    <!-- Las tarjetas seguras se inyectarán dinámicamente mediante JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Script del Motor del Mapa -->
    <script src="https://cloudflare.com"></script>
    
    <!-- Enlace a tu lógica JavaScript -->
    <script src="app.js"></script>
</body>
</html>
