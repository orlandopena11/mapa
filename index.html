<!-- PARTE: 1-2 (ESTRUCTURA CORE HTML5 ZILLOW V2) -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Inmobiliario - Inmobiliaria en Surco</title>
    <!-- Motores Estructurales y de Diseño -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" type="image/jpeg" href="logo.jpg" />

</head>
<body>
    <div class="app-container">
        <!-- Barra Superior Global (Navbar & Filtros Avanzados) -->
        <header class="navbar-global">
            <img src="logo.jpg" alt="Logo Zillow" class="navbar-brand-logo" id="app-main-logo">
            
            <div class="search-controls">
                <!-- Filtro 1: Buscador de Dirección -->
                <input type="text" class="search-input" id="search-address" placeholder="Dirección, ciudad o distrito...">
                
                <!-- Filtro 2: Tipo de Transacción (Reactivo) -->
                <div class="filter-dropdown-wrapper">
                    <button class="filter-btn" id="btn-filter-status">En venta ▾</button>
                    <div class="dropdown-content-panel" id="dropdown-status">
                        <div class="filter-group-options">
                            <label class="filter-checkbox-label">
                                <input type="radio" name="transaccion" value="Venta" checked> En venta
                            </label>
                            <label class="filter-checkbox-label">
                                <input type="radio" name="transaccion" value="Alquiler"> Para el alquiler
                            </label>
                            <label class="filter-checkbox-label">
                                <input type="radio" name="transaccion" value="Vendido"> Vendida
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Filtro 3: Rango de Precios -->
                <div class="filter-dropdown-wrapper">
                    <button class="filter-btn" id="btn-filter-price">Precio ▾</button>
                    <div class="dropdown-content-panel" id="dropdown-price">
                        <div class="filter-section-title">Rango de precios</div>
                        <div class="histogram-visual-container" id="price-histogram-box"></div>
                        <div class="range-inputs-inputs-row">
                            <input type="number" class="range-box-input" id="price-min" placeholder="No Min">
                            <span>-</span>
                            <input type="number" class="range-box-input" id="price-max" placeholder="No Max" value="1300000">
                        </div>
                    </div>
                </div>

                <!-- Filtro 4: Camas y Baños -->
                <div class="filter-dropdown-wrapper">
                    <button class="filter-btn" id="btn-filter-specs">Camas y baños ▾</button>
                    <div class="dropdown-content-panel" id="dropdown-specs">
                        <div class="filter-section-title">Dormitorios</div>
                        <div class="segmented-control-row" id="row-beds">
                            <button class="segmented-btn active" data-val="0">Cualquiera</button>
                            <button class="segmented-btn" data-val="1">1+</button>
                            <button class="segmented-btn" data-val="2">2+</button>
                            <button class="segmented-btn" data-val="3">3+</button>
                            <button class="segmented-btn" data-val="4">4+</button>
                            <button class="segmented-btn" data-val="5">5+</button>
                        </div>
                        <label class="filter-checkbox-label" style="margin-bottom: 12px;">
                            <input type="checkbox" id="beds-exact"> Coincidencia exacta
                        </label>
                        <div class="filter-section-title">Baños</div>
                        <div class="segmented-control-row" id="row-baths">
                            <button class="segmented-btn active" data-val="0">Cualquiera</button>
                            <button class="segmented-btn" data-val="1">1+</button>
                            <button class="segmented-btn" data-val="1.5">1.5+</button>
                            <button class="segmented-btn" data-val="2">2+</button>
                            <button class="segmented-btn" data-val="3">3+</button>
                            <button class="segmented-btn" data-val="4">4+</button>
                        </div>
                    </div>
                </div>

                <!-- Filtro 5: Tipo de Propiedad -->
                <div class="filter-dropdown-wrapper">
                    <button class="filter-btn" id="btn-filter-type">Tipo de propiedad ▾</button>
                    <div class="dropdown-content-panel" id="dropdown-type">
                        <div class="filter-group-options">
                            <label class="filter-checkbox-label">
                                <input type="checkbox" id="type-select-all" checked> Seleccione Todos
                            </label>
                            <label class="filter-checkbox-label">
                                <input type="checkbox" class="type-cb" value="Casa" checked> Casas
                            </label>
                            <label class="filter-checkbox-label">
                                <input type="checkbox" class="type-cb" value="Apartamento" checked> Apartamentos
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Contenedor Principal Split-View Respetando IDs Nativos -->
        <main class="split-view">
            <div class="map-wrapper">
                <div id="map-instance"></div>
            </div>
            
            <div class="properties-panel">
                <div class="panel-header">
                    <h1 id="results-counter">Cargando propiedades...</h1>
                </div>
                <!-- Punto de Inyección Sincronizado del Catálogo -->
                <div class="properties-grid" id="properties-grid-target"></div>
            </div>
        </main>
    </div>

    <!-- Carga de Motores JavaScript en el Cierre del Body -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
